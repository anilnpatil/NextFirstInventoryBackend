spring.application.name=NextFirstInventory
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventory}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
google.sheets.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}
inventory.sync.interval-ms=${INVENTORY_SYNC_INTERVAL_MS:900000}
inventory.sync.initial-delay-ms=${INVENTORY_SYNC_INITIAL_DELAY_MS:1000}